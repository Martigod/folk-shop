<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Админ панел - Folk Shop</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <h1>Folk Shop</h1>
        <p>Административен панел</p>
    </header>
    <nav>
        <a href="index.html">Начало</a>
        <a href="cart.html">Количка</a>
        <a href="admin.html">Админ</a>
    </nav>
    <main>
        <h2>Админ панел</h2>
        <div class="admin-box">
            <h3>Добавяне / редактиране на продукт</h3>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <label for="product-name">Име:</label>
                <input type="text" id="product-name">
                <label for="product-short">Кратко описание:</label>
                <input type="text" id="product-short">
                <label for="product-full">Пълно описание:</label>
                <textarea id="product-full"></textarea>
                <label for="product-price">Цена:</label>
                <input type="number" id="product-price">
                <label for="product-image">Име на снимка:</label>
                <input type="text" id="product-image">
                <button type="submit">Запази продукт</button>
                <button type="button" id="clear-product-form">Изчисти формата</button>
            </form>
            <p id="product-message"></p>
        </div>
        <div class="admin-box">
            <h3>Продукти</h3>
            <div id="admin-products"></div>
        </div>
        <div class="admin-box">
            <h3>Поръчки</h3>
            <div id="admin-orders"></div>
        </div>
    </main>
    <footer>
        <p>Folk Shop - учебен проект</p>
    </footer>
    <script src="JS/script.js"></script>
</body>
</html>
